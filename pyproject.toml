[project]
name = "fetta"
version = "0.1.0"
description = "Tool that fetches web pages for assistants"
readme = "README.md"
authors = [{ name = "Sergei" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0,<5",
    "playwright==1.63.0",
    "requests>=2.34.2,<3"
]

[project.scripts]
fetta = "fetta:main"

[project.urls]
Homepage = "https://github.com/spapulin/fetta"
Repository = "https://github.com/spapulin/fetta"
Issues = "https://github.com/spapulin/fetta/issues"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "requests-mock>=1.12.1",
    "ruff>=0.16.8",
]

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
